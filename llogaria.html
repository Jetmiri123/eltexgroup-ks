<!DOCTYPE html>
<html lang="sq" data-wf-site="64c7fd134e21b14134717e91">
<head>
  <meta charset="utf-8">
  <title>Llogaria — Eltex Group</title>
  <meta content="Kyçuni ose krijoni llogari B2B te Eltex Group." name="description">
  <meta content="width=device-width, initial-scale=1" name="viewport">
  <link href="css/normalize.css" rel="stylesheet" type="text/css">
  <link href="css/webflow.css" rel="stylesheet" type="text/css">
  <link href="css/gelander-fabrik.webflow.css" rel="stylesheet" type="text/css">
  <link href="css/eltex-custom.css" rel="stylesheet" type="text/css">
  <link href="css/eltex-scroll.css" rel="stylesheet" type="text/css">
  <link href="css/account.css" rel="stylesheet" type="text/css">
  <script type="text/javascript">!function(o,c){var n=c.documentElement,t=" w-mod-";n.className+=t+"js",("ontouchstart"in o||o.DocumentTouch&&c instanceof DocumentTouch)&&(n.className+=t+"touch")}(window,document);</script>
  <link href="images/favicon.png" rel="shortcut icon" type="image/x-icon">
</head>
<body>
  <div data-eltex-nav data-page="llogaria"></div>
  <script src="js/eltex-nav.js"></script>

  <section class="main_section padding margin account-page-section">
    <div class="wrapper">
      <div class="section_headline">
        <h1 class="big-text">Llogaria <span class="orange">B2B</span></h1>
      </div>

      <div class="account-shell">
        <div id="account-guest">
          <div class="account-tabs" role="tablist">
            <button type="button" class="account-tab is-active" data-account-tab="login" role="tab" aria-selected="true">Kyçu</button>
            <button type="button" class="account-tab" data-account-tab="signup" role="tab" aria-selected="false">Regjistrohu</button>
          </div>

          <div id="account-panel-login" class="account-panel account-card" role="tabpanel">
            <h2>Kyçu në llogari</h2>
            <p class="account-lead">Hyni vetëm pas aprovimit të llogarisë nga administratori.</p>
            <form id="login-form" class="account-form" novalidate>
              <label>
                Email
                <input type="email" name="email" autocomplete="email" required placeholder="email@kompania.com">
              </label>
              <label>
                Fjalëkalimi
                <input type="password" name="password" autocomplete="current-password" required minlength="8" placeholder="Fjalëkalimi">
              </label>
              <button type="submit" class="account-submit">Kyçu</button>
            </form>
          </div>

          <div id="account-panel-signup" class="account-panel account-card" role="tabpanel" hidden>
            <h2>Krijo llogari</h2>
            <p class="account-lead">Plotësoni të dhënat. Kërkesa shkon te administratori për aprovim.</p>
            <form id="signup-form" class="account-form" novalidate>
              <label>
                Emri dhe mbiemri *
                <input type="text" name="name" autocomplete="name" required placeholder="Emri juaj">
              </label>
              <label>
                Email *
                <input type="email" name="email" autocomplete="email" required placeholder="email@kompania.com">
              </label>
              <label>
                Telefoni
                <input type="tel" name="phone" autocomplete="tel" placeholder="+383 ...">
              </label>
              <label>
                Kompania
                <input type="text" name="company" autocomplete="organization" placeholder="Emri i kompanisë">
              </label>
              <label>
                Fjalëkalimi *
                <input type="password" name="password" autocomplete="new-password" required minlength="8" placeholder="Të paktën 8 karaktere">
              </label>
              <button type="submit" class="account-submit">Dërgo kërkesën</button>
            </form>
          </div>

          <p id="account-message" class="account-message" hidden></p>
        </div>

        <div id="account-user" class="account-card account-status-card" hidden>
          <span id="account-status-badge" class="account-status-badge"></span>
          <h2 id="account-user-name"></h2>
          <p id="account-user-email" class="account-user-meta"></p>
          <p id="account-user-company" class="account-user-meta"></p>
          <p id="account-user-note" class="account-lead"></p>
          <button type="button" id="account-logout" class="account-logout">Dil nga llogaria</button>
        </div>
      </div>
    </div>
  </section>

  <div data-eltex-footer></div>

  <script src="https://d3e54v103j8qbb.cloudfront.net/js/jquery-3.5.1.min.dc5e7f18c8.js?site=64c7fd134e21b14134717e91" crossorigin="anonymous"></script>
  <script src="js/webflow.js"></script>
  <script src="js/eltex-auth.js"></script>
  <script src="js/eltex-cart.js"></script>
  <script src="js/account-page.js"></script>
  <script src="js/eltex-scroll.js"></script>
  <script src="js/eltex-cta.js"></script>
  <script src="js/eltex-fixes.js"></script>
  <script src="js/eltex-footer.js"></script>
</body>
</html>
