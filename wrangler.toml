name = "eltexgroup-ks"
main = "worker/index.js"
compatibility_date = "2024-09-01"
workers_dev = true
compatibility_flags = ["global_fetch_strictly_public"]

# Routes (keep your existing A records — do NOT use Custom Domain in dashboard)
[[routes]]
pattern = "eltexgroup-rks.com/*"
zone_name = "eltexgroup-rks.com"

[[routes]]
pattern = "www.eltexgroup-rks.com/*"
zone_name = "eltexgroup-rks.com"

[assets]
directory = "."
binding = "ASSETS"
html_handling = "none"
run_worker_first = true

[[kv_namespaces]]
binding = "KV"
id = "b9e70c0bec494769bde7d8ff6bd65cdd"

[vars]
ELTEX_ADMIN_PASSWORD = "Eltex2026!"
ELTEX_ORDER_EMAIL = "info@eltexgroup-ks.com"
